state_path: ../../../../assets/state.json

system:
  max_event_queue_size: 10
  enable_filesystem_watching: true
  state_mode: AddOnly
  num_preload_forward: 4

logging:
  directory: ../../../../logs/
  level: Trace

display:
  force_unicode_kitty_display: false
  properties:
    scaling_coeff: 1.1
    invert_colors: true
    make_bolder: true
    palette: skim

controller:
  rows_per_scroll: 10
  zoom_multipler: 1.5

  key_mappings:
    - command: Quit
      keys: q

    - command: Reload
      keys: r

    - command: CloseDocument
      keys: x

    - command: ScrollNext
      keys: j

    - command: ScrollPrev
      keys: k

    - command: NumNextPage
      keys: j

    - command: NumPrevPage
      keys: k

    - command: GoToFirstPage
      keys: gg

    - command: GoToLastPage
      keys: G

    - command: NumGoToPage
      keys: G

    - command: NextDocument
      keys: l

    - command: PrevDocument
      keys: h

    - command: NumNextDocument
      keys: l

    - command: NumPrevDocument
      keys: h

    - command: NextLayout
      keys: s

    - command: PrevLayout
      keys: S

    - command: InvertColors
      keys: i

    - command: IncreaseScalingFactor
      keys: z=

    - command: DecreaseScalingFactor
      keys: z-

    - command: ToggleSidebar
      keys: t

    - command: ToggleBold
      keys: b

    - command: TogglePalette
      keys: p
